name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite an image tag that is already published on ghcr.io (dangerous; default off)'
        required: false
        type: boolean
        default: false

jobs:
  variables:
    runs-on: ubuntu-latest
    outputs:
      ARCH_LIST: ${{ env.ARCH_LIST }}
      ADDON_LIST: ${{ env.ADDON_LIST }}
      BUILD_ARGS: ${{ env.BUILD_ARGS }}
    steps:
    - uses: actions/checkout@v3

    - name: "ARGS: default" # PR or other events - test only, no push
      run: |
        echo "ADDON_LIST=['frpc']" >> $GITHUB_ENV
        echo "BUILD_ARGS=--no-latest --test" >> $GITHUB_ENV

    - name: "ARGS: frpc main branch" # Build and push to main branch
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      run: |
        echo "ADDON_LIST=['frpc']" >> $GITHUB_ENV
        echo "BUILD_ARGS=--no-cache" >> $GITHUB_ENV

    - name: "ARGS: frpc release version" # Build of addon release version
      if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
      run: |
        echo "ADDON_LIST=['frpc']" >> $GITHUB_ENV
        echo "BUILD_ARGS=--no-cache --docker-hub-check" >> $GITHUB_ENV

    - name: Determine arch
      id: determine_arch
      run: |
        ARCH_LIST=$(jq -r -c '.arch' ./${{ fromJSON(env.ADDON_LIST)[0] }}/config.json)
        echo "Found the following arches: $ARCH_LIST"
        echo "ARCH_LIST=$ARCH_LIST" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: variables
    env:
      BUILD_ARGS: ${{needs.variables.outputs.BUILD_ARGS}}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ${{fromJSON(needs.variables.outputs.ARCH_LIST)}}
        addon: ${{fromJSON(needs.variables.outputs.ADDON_LIST)}}
    steps:
    - uses: actions/checkout@v3

    - name: Log in to ghcr.io
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if version is already published
      # Published version tags are immutable: never re-push an existing
      # <image>:<version>. Skip build+push for this arch instead of failing.
      # Only a manual workflow_dispatch with force=true may overwrite.
      id: published
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
      run: |
        version=$(jq -r '.version' ./${{ matrix.addon }}/config.json)
        image=$(jq -r '.image' ./${{ matrix.addon }}/config.json | sed "s/{arch}/${{ matrix.arch }}/")
        ref="${image}:${version}"
        if out=$(docker manifest inspect "$ref" 2>&1); then
          if [ "$FORCE" = "true" ]; then
            echo "::warning::${ref} already exists on the registry; force=true, it WILL be overwritten"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${ref} already published; skipping build and push (published tags are never overwritten)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        elif echo "$out" | grep -qiE 'manifest unknown|no such manifest|not found'; then
          echo "${ref} not published yet; will build and push"
          echo "skip=false" >> "$GITHUB_OUTPUT"
        else
          echo "$out"
          echo "::error::Could not determine whether ${ref} exists; refusing to push to avoid overwriting a published tag"
          exit 1
        fi

    - name: Prepare data folder
      if: steps.published.outputs.skip != 'true'
      run: |
        cp common/Dockerfile ${{ matrix.addon }}
        cp common/build.yaml ${{ matrix.addon }}

    - name: Build
      if: steps.published.outputs.skip != 'true'
      # Pinned builder (validated with the 2.x multi-stage Dockerfile).
      # The image downloads prebuilt artifacts from the GitHub Release
      # v<version>, so the release assets must exist before this job runs.
      uses: home-assistant/builder@2025.09.0
      # Note: if running without `--test`, image is pushed to ghcr.io
      with:
        args: |
          --${{ matrix.arch }} \
          --target ${{ matrix.addon }} \
          ${{ env.BUILD_ARGS }}
